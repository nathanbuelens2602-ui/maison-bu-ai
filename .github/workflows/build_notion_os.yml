name: Build Notion Marketing OS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/maison-bu-marketing-system-W0eBb

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installeer dependencies
        run: pip install requests python-dotenv

      - name: Test Notion verbinding
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          echo "Token aanwezig: $([ -n "$NOTION_TOKEN" ] && echo JA || echo NEE)"
          curl -s -w "\nHTTP status: %{http_code}\n" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28" \
            https://api.notion.com/v1/users/me

      - name: Bouw Notion Marketing OS
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python tools/notion_builder.py
