name: Build Notion Marketing OS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.NOTION_TOKEN }}
      VER: "2022-06-28"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/maison-bu-marketing-system-W0eBb

      # ── 1. Zoek de root pagina ─────────────────────────────────────────────
      - name: Zoek root pagina
        id: root
        run: |
          SEARCH=$(curl -sf -X POST https://api.notion.com/v1/search \
            -H "Authorization: Bearer $TOKEN" \
            -H "Notion-Version: $VER" \
            -H "Content-Type: application/json" \
            -d '{"query":"Maison BU Marketing OS","filter":{"property":"object","value":"page"}}')
          ROOT_ID=$(echo "$SEARCH" | python3 -c "import sys,json;r=json.load(sys.stdin)['results'];print(r[0]['id'] if r else '')" 2>/dev/null)
          echo "root_id=$ROOT_ID" >> $GITHUB_OUTPUT
          echo "Root pagina ID: $ROOT_ID"

      # ── 2. Maak Content Database aan ──────────────────────────────────────
      - name: Maak Content Database
        id: db
        run: |
          ROOT_ID="${{ steps.root.outputs.root_id }}"
          BODY=$(cat <<'ENDJSON'
          {
            "parent": {"type":"page_id","page_id":"ROOT_ID_PLACEHOLDER"},
            "title": [{"text":{"content":"📋 Content Database — Juni 2026"}}],
            "properties": {
              "Titel":           {"title":{}},
              "Type":            {"select":{"options":[{"name":"Reel","color":"purple"},{"name":"Feedpost","color":"blue"},{"name":"Story Flow","color":"green"},{"name":"Email","color":"yellow"}]}},
              "Week":            {"select":{"options":[{"name":"Week 1","color":"gray"},{"name":"Week 2","color":"brown"},{"name":"Week 3","color":"orange"},{"name":"Week 4","color":"red"}]}},
              "Pillar":          {"select":{"options":[{"name":"De Maison","color":"default"},{"name":"De Craft","color":"purple"},{"name":"De Gast","color":"blue"},{"name":"De Transformatie","color":"green"},{"name":"De Filosofie","color":"gray"},{"name":"De Ceremonie","color":"pink"}]}},
              "Status":          {"select":{"options":[{"name":"Idee","color":"gray"},{"name":"In Productie","color":"yellow"},{"name":"Klaar","color":"blue"},{"name":"Gepubliceerd","color":"green"}]}},
              "Publicatiedatum": {"date":{}},
              "CTA":             {"select":{"options":[{"name":"Geen","color":"gray"},{"name":"Fluistering","color":"blue"},{"name":"Weloverwogen","color":"orange"},{"name":"Uitnodiging","color":"red"}]}},
              "Asset Link":      {"url":{}}
            }
          }
          ENDJSON
          )
          BODY=$(echo "$BODY" | sed "s/ROOT_ID_PLACEHOLDER/$ROOT_ID/g")
          RESP=$(curl -sf -X POST https://api.notion.com/v1/databases \
            -H "Authorization: Bearer $TOKEN" \
            -H "Notion-Version: $VER" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          DB_ID=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          echo "db_id=$DB_ID" >> $GITHUB_OUTPUT
          echo "Database ID: $DB_ID"

      # ── 3. Voeg alle 36 items toe ──────────────────────────────────────────
      - name: Voeg content items toe
        run: |
          DB="${{ steps.db.outputs.db_id }}"
          add_item() {
            local TITEL="$1" TYPE="$2" WEEK="$3" PILLAR="$4" DATUM="$5" CTA="$6"
            curl -sf -X POST https://api.notion.com/v1/pages \
              -H "Authorization: Bearer $TOKEN" \
              -H "Notion-Version: $VER" \
              -H "Content-Type: application/json" \
              -d "{\"parent\":{\"database_id\":\"$DB\"},\"properties\":{\"Titel\":{\"title\":[{\"text\":{\"content\":\"$TITEL\"}}]},\"Type\":{\"select\":{\"name\":\"$TYPE\"}},\"Week\":{\"select\":{\"name\":\"$WEEK\"}},\"Pillar\":{\"select\":{\"name\":\"$PILLAR\"}},\"Status\":{\"select\":{\"name\":\"Klaar\"}},\"Publicatiedatum\":{\"date\":{\"start\":\"$DATUM\"}},\"CTA\":{\"select\":{\"name\":\"$CTA\"}}}}" > /dev/null
            echo "  ✓ $TITEL"
            sleep 0.4
          }
          echo "Week 1 — Wereldopbouw"
          add_item "Reel 01 — Juni betreedt de maison"                    "Reel"       "Week 1" "De Maison"        "2026-06-02" "Geen"
          add_item "Reel 02 — Het golf van zomer"                         "Reel"       "Week 1" "De Craft"         "2026-06-06" "Geen"
          add_item "Post 01 — Juni betreedt de maison"                    "Feedpost"   "Week 1" "De Maison"        "2026-06-02" "Geen"
          add_item "Post 02 — Over vakmanschap in de zomer (Kristof)"     "Feedpost"   "Week 1" "De Filosofie"     "2026-06-05" "Geen"
          add_item "Post 03 — De signature cut, opnieuw gedacht"          "Feedpost"   "Week 1" "De Craft"         "2026-06-04" "Geen"
          add_item "SF 01 — Hoe juni eruitziet in de maison"              "Story Flow" "Week 1" "De Maison"        "2026-06-01" "Geen"
          add_item "SF 02 — De maison in de vroege ochtend"               "Story Flow" "Week 1" "De Maison"        "2026-06-03" "Geen"
          add_item "SF 03 — Vijf dingen die we nooit zullen doen"         "Story Flow" "Week 1" "De Filosofie"     "2026-06-06" "Geen"
          add_item "SF 04 — Wat is een signature cut?"                    "Story Flow" "Week 1" "De Craft"         "2026-06-07" "Geen"
          echo "Week 2 — De Fluistering"
          add_item "Reel 03 — Een kleur die zichzelf niet aankondigt"     "Reel"       "Week 2" "De Transformatie" "2026-06-09" "Fluistering"
          add_item "Reel 04 — De gast die een dinsdag droeg"              "Reel"       "Week 2" "De Gast"          "2026-06-13" "Fluistering"
          add_item "Post 04 — De golf die altijd bestond"                 "Feedpost"   "Week 2" "De Transformatie" "2026-06-08" "Fluistering"
          add_item "Post 05 — Ze arriveerde met een dinsdag"              "Feedpost"   "Week 2" "De Gast"          "2026-06-11" "Fluistering"
          add_item "Post 06 — Kleur die zichzelf niet aankondigt"         "Feedpost"   "Week 2" "De Transformatie" "2026-06-13" "Fluistering"
          add_item "SF 05 — Beachwaves voor jouw haar"                    "Story Flow" "Week 2" "De Craft"         "2026-06-10" "Fluistering"
          add_item "SF 06 — Wat onze gasten echt voelen"                  "Story Flow" "Week 2" "De Gast"          "2026-06-10" "Fluistering"
          add_item "SF 07 — De kleur van juni"                            "Story Flow" "Week 2" "De Transformatie" "2026-06-14" "Fluistering"
          add_item "SF 08 — Kristof over zomer en terughoudendheid"       "Story Flow" "Week 2" "De Filosofie"     "2026-06-12" "Fluistering"
          echo "Week 3 — De Weloverwogen Vraag"
          add_item "Reel 05 — Kristof over vakmanschap"                   "Reel"       "Week 3" "De Filosofie"     "2026-06-16" "Weloverwogen"
          add_item "Reel 06 — De ceremonieochtend"                        "Reel"       "Week 3" "De Ceremonie"     "2026-06-20" "Weloverwogen"
          add_item "Post 07 — Sommige dagen vragen alles (Huwelijk)"      "Feedpost"   "Week 3" "De Ceremonie"     "2026-06-16" "Weloverwogen"
          add_item "Post 08 — Over niet achter trends aanlopen (Kristof)" "Feedpost"   "Week 3" "De Filosofie"     "2026-06-19" "Geen"
          add_item "Post 09 — De communieochtend"                         "Feedpost"   "Week 3" "De Ceremonie"     "2026-06-20" "Weloverwogen"
          add_item "SF 09 — De bruid de avond voor de ceremonie"          "Story Flow" "Week 3" "De Ceremonie"     "2026-06-15" "Weloverwogen"
          add_item "SF 10 — De communieochtend"                           "Story Flow" "Week 3" "De Ceremonie"     "2026-06-17" "Weloverwogen"
          add_item "SF 11 — Waarom we e-mail verkiezen boven een link"    "Story Flow" "Week 3" "De Filosofie"     "2026-06-18" "Weloverwogen"
          add_item "SF 12 — De headspa in juni"                           "Story Flow" "Week 3" "De Craft"         "2026-06-21" "Weloverwogen"
          echo "Week 4 — De Uitnodiging"
          add_item "Reel 07 — De vlucht is over drie dagen"               "Reel"       "Week 4" "De Gast"          "2026-06-23" "Uitnodiging"
          add_item "Reel 08 — Een opening heeft zich voorgedaan"          "Reel"       "Week 4" "De Maison"        "2026-06-27" "Uitnodiging"
          add_item "Post 10 — Ze had het uitgesteld tot juni"             "Feedpost"   "Week 4" "De Gast"          "2026-06-23" "Uitnodiging"
          add_item "Post 11 — De maison is klaar om u te ontvangen"       "Feedpost"   "Week 4" "De Maison"        "2026-06-25" "Uitnodiging"
          add_item "Post 12 — Deze zomer besloot ze te stoppen met haasten" "Feedpost" "Week 4" "De Gast"          "2026-06-28" "Uitnodiging"
          add_item "SF 13 — De vlucht is over drie dagen"                 "Story Flow" "Week 4" "De Gast"          "2026-06-22" "Uitnodiging"
          add_item "SF 14 — Zij had het al sinds mei bedacht"             "Story Flow" "Week 4" "De Gast"          "2026-06-24" "Uitnodiging"
          add_item "SF 15 — Wat juli niet kan geven wat juni nog kan"     "Story Flow" "Week 4" "De Maison"        "2026-06-28" "Uitnodiging"
          add_item "SF 16 — Maison BU wenst u een mooie zomer"           "Story Flow" "Week 4" "De Maison"        "2026-06-30" "Uitnodiging"

      # ── 4. Maak sub-pagina's aan ───────────────────────────────────────────
      - name: Maak sub-paginas aan
        run: |
          ROOT="${{ steps.root.outputs.root_id }}"
          make_page() {
            local TITLE="$1"
            curl -sf -X POST https://api.notion.com/v1/pages \
              -H "Authorization: Bearer $TOKEN" \
              -H "Notion-Version: $VER" \
              -H "Content-Type: application/json" \
              -d "{\"parent\":{\"page_id\":\"$ROOT\"},\"properties\":{\"title\":{\"title\":[{\"text\":{\"content\":\"$TITLE\"}}]}}}" > /dev/null
            echo "  ✓ $TITLE"
            sleep 0.4
          }
          make_page "🌅 Vandaag"
          make_page "📅 Deze Week"
          make_page "🔄 Posting Workflow"
          make_page "🎨 Merkrichtlijnen"
          make_page "✅ Checklists"
          make_page "📁 Asset Beheer"
          make_page "📸 Shootdag Planner"
          make_page "📝 Templates"

      # ── 5. Klaar ───────────────────────────────────────────────────────────
      - name: Klaar
        run: |
          ROOT="${{ steps.root.outputs.root_id }}"
          echo ""
          echo "✅ Maison BU Marketing OS is volledig aangemaakt!"
          echo ""
          echo "Ga naar Notion:"
          echo "https://notion.so/${ROOT//-/}"
