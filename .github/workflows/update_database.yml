name: Update Content Database — Properties & Views

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.NOTION_TOKEN }}
      VER: "2022-06-28"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/maison-bu-marketing-system-W0eBb

      # ── 1. Zoek Content Database ───────────────────────────────────────────
      - name: Zoek Content Database
        id: db
        run: |
          SEARCH=$(curl -sf -X POST https://api.notion.com/v1/search \
            -H "Authorization: Bearer $TOKEN" \
            -H "Notion-Version: $VER" \
            -H "Content-Type: application/json" \
            -d '{"query":"Content Database","filter":{"property":"object","value":"database"}}')
          DB_ID=$(echo "$SEARCH" | python3 -c \
            "import sys,json; r=json.load(sys.stdin)['results']; print(r[0]['id'] if r else '')" 2>/dev/null)
          echo "db_id=$DB_ID" >> $GITHUB_OUTPUT
          echo "Database ID: $DB_ID"

      # ── 2. Voeg ontbrekende properties toe ────────────────────────────────
      - name: Voeg ontbrekende properties toe
        run: |
          DB="${{ steps.db.outputs.db_id }}"
          RESP=$(curl -sf -X PATCH "https://api.notion.com/v1/databases/$DB" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Notion-Version: $VER" \
            -H "Content-Type: application/json" \
            -d '{
              "properties": {
                "Caption": {
                  "rich_text": {}
                },
                "Platform": {
                  "multi_select": {
                    "options": [
                      {"name": "Instagram Feed",  "color": "blue"},
                      {"name": "Instagram Story", "color": "green"},
                      {"name": "Instagram Reel",  "color": "purple"},
                      {"name": "E-mail",          "color": "yellow"}
                    ]
                  }
                },
                "Hashtags": {
                  "rich_text": {}
                },
                "Visueel": {
                  "rich_text": {}
                },
                "Goedgekeurd": {
                  "checkbox": {}
                },
                "Campagne": {
                  "select": {
                    "options": [
                      {"name": "De Zoetheid van Juni", "color": "blue"}
                    ]
                  }
                },
                "Noten": {
                  "rich_text": {}
                }
              }
            }')
          echo "$RESP" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print('✓ Properties bijgewerkt:', list(d.get('properties',{}).keys()))" 2>/dev/null \
            || echo "  ⚠ Kon response niet parsen"

      # ── 3. Klaar ──────────────────────────────────────────────────────────
      - name: Klaar
        run: |
          DB="${{ steps.db.outputs.db_id }}"
          echo ""
          echo "✅ Content Database bijgewerkt!"
          echo ""
          echo "Nieuwe properties toegevoegd:"
          echo "  • Caption       (tekst — de volledige caption)"
          echo "  • Platform      (multi-select: Feed / Story / Reel / E-mail)"
          echo "  • Hashtags      (tekst)"
          echo "  • Visueel       (tekst — beschrijving van het beeld)"
          echo "  • Goedgekeurd   (checkbox)"
          echo "  • Campagne      (select: De Zoetheid van Juni)"
          echo "  • Noten         (tekst)"
          echo ""
          echo "Open de database in Notion:"
          echo "https://notion.so/${DB//-/}"
          echo ""
          echo "Stap na de workflow:"
          echo "  Stel views in (Board, Kalender) — zie instructies in de Vandaag-pagina."
